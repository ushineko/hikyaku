name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Nothing by default; each job says what it needs. Actions are pinned by
# commit, not by tag, which whoever controls an Action's repository can move;
# Dependabot keeps the pins current.
permissions: {}

# The newest patch release of this line, looked up on each run. go.mod's `go`
# line is the minimum the code needs.
env:
  GO_VERSION: "1.27.x"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: No binaries in the repository
        run: make check-no-binaries

      # The fake Slack in internal/slacktest stands in for Slack; no token
      # reaches CI.
      - name: Test
        run: go test -race ./...

      - name: Lint
        run: make lint

      - name: Build
        run: make build

  # What a release publishes is built here and published by the job after
  # it, as in hayami. This job runs no tests, reads no cache, keeps no token
  # and can write nothing.
  build-release:
    name: Build the release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          go-download-base-url: https://go.dev/dl
          cache: false

      # VERSION is the version of record; a tag that disagrees with it fails
      # here rather than shipping.
      - name: Check the tag matches VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Build the release tarball
        run: make release

      # A build off the tag, or from a modified tree, says `-dev`; a release
      # that said so could not be told from a desk's own build.
      - name: The release says its own version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          ./hikyaku --version | grep -Fx "hikyaku version $v"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hikyaku-release
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Release is published here and never by hand: pushing a v* tag is the
  # whole of the ceremony. This job holds the only write rights in the
  # workflow, so it runs nothing from the repository or its modules.
  release:
    name: Release
    needs: [test, build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # For README.md and for main's history. Read as data; nothing in it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is a commit on main. A tag with a suffix is a pre-release,
      # which may be tried from a branch.
      - name: A release is a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "pre-release $TAG: not required to be on main" ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main \
                 || { echo "$TAG names a commit that is not on main"; exit 1; } ;;
          esac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-release.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The notes are this version's changelog entry. The job fails when the
      # entry is missing, which checks the changelog was written before the
      # tag was pushed.
      - name: Take the release notes from the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "### " v) == 1 { f = 1; next }
            f && /^### / { exit }
            f { print }
          ' README.md > dist/NOTES.md
          test -s dist/NOTES.md || { echo "no changelog entry for $ver in README.md"; exit 1; }
          cat dist/NOTES.md

      # Build provenance, checked with
      # `gh attestation verify <file> -R ushineko/hikyaku`. Before the
      # release, so a failure here publishes nothing.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) kind="--prerelease --latest=false" ;;
            *) kind="--latest" ;;
          esac
          # shellcheck disable=SC2086 # $kind is one or two flags
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file dist/NOTES.md --generate-notes $kind \
            dist/*.tar.gz dist/SHA256SUMS
